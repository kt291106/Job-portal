
spring.application.name=jobportal

spring.datasource.url=jdbc:mysql://localhost:3306/job_portal
spring.datasource.username=root
spring.datasource.password=Password@123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Resume uploads (PDF/DOC/DOCX, max 5 MB) are stored in this folder.
# It is outside the project so VS Code Live Server does not reload pages on upload.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=${user.home}/careernest-uploads/resumes

# Admin account created on startup if it does not exist yet.
# Change the password before using this anywhere other than your own machine.
app.admin.email=admin@careernest.local
app.admin.password=Admin@12345

# Seed/demo accounts (aarav@, priya@, neha@, admin@example.test) have placeholder
# hashes in the database; on startup they get this password so they can log in.
# neha@example.test is the recruiter for TechNova Solutions (company 1).
app.demo.password=Demo@12345
